<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SettleMate</title>
<style>
  body {
    background-color: #f8f6f2;
  }

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
  }
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background-color: white;
    border-top: 1px solid #ddd;
    display: flex;
  }
  
  .tab{
    flex: 1;
    border: none;
    background: none;
    font-size: 14px;
    cursor: pointer;
  }

  .fab {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 50px;
    height: 50px;
    border-radius: 25px;
    background-color: #007bff;
    color: white;
    font-size: 24px;
    border: none;
    cursor: pointer;
    text-align: center;
    line-height: 10px;
  }

  .hidden {
    display: none;
  }

  .modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: white;
    padding: 20px;
    z-index: 1000;
    overflow-y: auto;
  }

  .modal.active {
    display: block;
  }

  .modal-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }


</style>
</head>
<body>
  <section id="screen-friends" class="screen active">
    <h1>Friends</h1>
    <label for="friends-name">Add a new friend:</label>
    <input id="friends-name" type="text">
    <button id="add-friend">Add Friend</button>
    
    <ul id="friends-list"></ul>
  </section>
  
  <section id="screen-groups" class="screen">
    <h1>Groups</h1>
    <p>Here you can manage your groups and see your group list.</p>
  </section>
  
  <section id="screen-activity" class="screen">
    <h1>Activity</h1>
    <p>Here you can see your recent activity, including expenses, payments, and friend requests.</p>
  </section>
  
  <section id="screen-account" class="screen">
    <h1>Account</h1>
    <p><strong id="current-user-name">...</strong></p>
  </section>
  <nav class="tabbar">
    <button class="tab" data-screen="friends">Friends</button>
    <button class="tab" data-screen="groups">Groups</button>
    <button class="tab" data-screen="activity">Activity</button>
    <button class="tab" data-screen="account">Account</button>
  </nav>
  <button id="open-expense-modal" class="fab">+</button>
  <div id="expense-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Add Expense</h2>
      <label for="friend-select">Pick a friend to split with:</label>
      <select id="friend-select">
        <option value="">Select a friend</option>
      </select>
      <label for="expense-paid-by">Paid by:</label>
      <select id="expense-paid-by">
        <option value="">Select who paid</option>
      </select>
      <label for="expense-description">Description:</label>
      <input id="expense-description" type="text">
      <label for="expense-amount">Amount:</label>
      <input id="expense-amount" type="number" step="0.01">
      <button id="save-expense">Save</button>
      <button id="cancel-expense">Cancel</button>
    </div>
  </div>
  
  <script>
    const { invoke } = window.__TAURI__.core;
    // navigacija med zasloni
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const screenId = `screen-${tab.dataset.screen}`;
        document.querySelectorAll('.screen').forEach(screen => {
          screen.classList.toggle('active', screen.id === screenId);
        });
      });
    });
    // dodajanje prijateljev
    async function loadFriends() {
      try {
        const friends = await invoke('list_friends');
        friends.sort((a, b) => a.name.localeCompare(b.name));
        const friendsList = document.getElementById('friends-list');
        friendsList.innerHTML = '';
        friends.forEach(friend => {
          const li = document.createElement('li');
          li.textContent = friend.name;
          friendsList.appendChild(li);
        });
      } catch (error) {
        console.error('Error loading friends:', error);
      }
    }
    loadFriends();
    document.getElementById('add-friend').addEventListener('click', async () => {
      const nameInput = document.getElementById('friends-name');
      const name = nameInput.value.trim();
      if (name) {
        try {
          await invoke('add_friend', { name });
          nameInput.value = '';
          loadFriends();
        } catch (error) {
          console.error('Error adding friend:', error);
          alert('Failed to add friend. Please try again.');
        }
      } else {
        alert('Please enter a valid name.');
      }
    });


    // pridobivanje trenutnega uporabnika
    async function loadCurrentUser() {
      try {
        const user = await invoke('get_current_user');
        document.getElementById('current-user-name').textContent = user.name;
      } catch (error) {
        console.error('Error loading current user:', error);
      }
    }
    loadCurrentUser();

    // gumb za odpiranje modalnega okna za dodajanje stroška
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const screenId = `screen-${tab.dataset.screen}`;
        document.querySelectorAll('.screen').forEach(screen => {
          screen.classList.toggle('active', screen.id === screenId);
        });
        if (tab.dataset.screen === 'account') {
          document.getElementById('open-expense-modal').classList.add('hidden');
        } else {
          document.getElementById('open-expense-modal').classList.remove('hidden');
        }
      });
    });

    // odpiranje in zapiranje modalnega okna
    const openExpenseModal = document.getElementById('open-expense-modal');
    openExpenseModal.addEventListener('click', () => {
      document.getElementById('expense-modal').classList.add('active');
    });

    const closeExpenseModal = document.getElementById('cancel-expense');
    closeExpenseModal.addEventListener('click', () => {
      document.getElementById('expense-modal').classList.remove('active');
    });

    // shranjevanje novega stroška
    document.getElementById('save-expense').addEventListener('click', async () => {
      const description = document.getElementById('expense-description').value.trim();
      const amount = parseFloat(document.getElementById('expense-amount').value);

          document.getElementById('expense-amount').value = '';
          document.getElementById('expense-modal').classList.remove('active');
        } catch (error) {
          console.error('Error adding expense:', error);
          alert('Failed to add expense. Please try again.');
        }
      } else {
        alert('Please enter a valid description and amount.');
      }
    });

    // nalaganje prijateljev v izbirniku
    async function loadFriendsForExpense() {
      try {
        const friends = await invoke('list_friends');
        const friendSelect = document.getElementById('friend-select');
        friendSelect.innerHTML = '<option value="">Select a friend</option>';
        friends.forEach(friend => {
          const option = document.createElement('option');
          option.value = friend.id;
          option.textContent = friend.name;
          friendSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading friends for expense:', error);
      }
    }
    loadFriendsForExpense();

    // izbira kdo je plačal
    async function loadCurrentUserorFriendForExpense() {
      try {
        const user = await invoke('get_current_user');
        const paidBySelect = document.getElementById('expense-paid-by');
        paidBySelect.innerHTML = `<option value="${user.id}">${user.name}</option>`;
      } catch (error) {
        console.error('Error loading current user for expense:', error);
      }
    }
    loadCurrentUserorFriendForExpense();
  



  </script>
</body>
</html>
