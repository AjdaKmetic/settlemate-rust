<div class="modal-overlay">
    <div class="modal-card">
        <div class="section-header">
            <h2>Add expense</h2>
        </div>

        <form
            hx-post="/expenses"
            hx-target="#modal-slot"
            hx-swap="innerHTML"
        >
            <label>
                Description
                <input
                    type="text"
                    name="description"
                    required
                >
            </label>

            <div class="group-fields">
                <label>
                    Split with
                    <select
                        name="friend_ids"
                        multiple
                        size="1"
                        required
                    >
                        {% for friend in friends %}
                        <option
                            value="{{ friend.id }}"
                            {% if loop.first %}selected{% endif %}
                        >
                            {{ friend.name }}
                        </option>
                        {% endfor %}
                    </select>
                </label>

                <label>
                    Amount
                    <input
                        type="number"
                        name="amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                    <span>€</span>
                </label>
            </div>

            <div class="form-actions">
                <button
                    type="button"
                    class="btn-cancel"
                    hx-get="/expenses/close"
                    hx-target="#modal-slot"
                    hx-swap="innerHTML"
                >
                    Cancel
                </button>

                <button type="submit" class="btn-create">
                    Add Expense
                </button>
            </div>
        </form>
    </div>
</div>
