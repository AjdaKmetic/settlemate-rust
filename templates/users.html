<!doctype html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Uporabniki — SettleMate</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <h1>Uporabniki</h1>

  <h2>Dodaj novega</h2>
  {# Form pošlje POST na /users; odgovor (<li>...</li>) HTMX doda na konec seznama. #}
  <form hx-post="/users"
        hx-target="#users-list"
        hx-swap="beforeend"
        hx-on::after-request="this.reset()">
    <label>Ime: <input name="name" required></label>
    <label>Email: <input name="email" type="email" required></label>
    <label>Geslo: <input name="password" type="password" required></label>
    <button type="submit">Dodaj</button>
  </form>

  <h2>Obstoječi uporabniki</h2>
  <ul id="users-list">
    {% for u in users %}
      <li>{{ u.name }} ({{ u.email }})</li>
    {% endfor %}
  </ul>
</body>
</html>
