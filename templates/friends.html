<section
    class="tab-panel"
    id="friends-panel"
    role="tabpanel"
    aria-labelledby="friends-tab"
    data-panel="friends"
>
    <div class="section-header">
        <h2>Friends</h2>

        <button
            class="btn-create"
            type="button"
            hx-get="/friends/form"
            hx-target="#friend-form-slot"
            hx-swap="innerHTML"
        >
            + Add Friend
        </button>
    </div>

    <div id="friend-form-slot"></div>

    {% for friend in friends %}
    <div class="list-row friend-row{% if loop.last %} last{% endif %}">
        <div class="friend-avatar">
            {{ friend.initials }}
        </div>

        <div class="row-info">
            <p class="row-title">{{ friend.name }}</p>
            <p class="row-meta">{{ friend.email }}</p>
            <form
                class="friend-remove-form"
                hx-post="/friends/{{ friend.id }}/delete"
                hx-target="#friends-panel"
                hx-swap="outerHTML"
                hx-confirm="Remove {{ friend.name }} from your friends?"
            >
                <button class="btn-delete" type="submit">
                    Remove friend
                </button>
            </form>
        </div>

        <div class="row-balance {{ friend.balance_state_class }}">
            <p class="amount">
                {{ friend.formatted_balance }}
            </p>

            <p class="balance-note">
                {{ friend.balance_note }}
            </p>

            {% if friend.has_balance %}
            <form
                class="settle-form"
                hx-post="/friends/{{ friend.id }}/settle"
                hx-confirm="Mark the full balance with {{ friend.name }} as settled?"
            >
                <button class="btn-settle" type="submit">
                    Settle up
                </button>
            </form>
            {% endif %}
        </div>
    </div>
    {% endfor %}

    {% if friends.is_empty() %}
    <div class="empty-state">
        <p class="secondary-text">
            No friends added yet.
        </p>
    </div>
    {% endif %}
</section>
