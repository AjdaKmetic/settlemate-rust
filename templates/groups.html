<section class="tab-panel" id="groups-panel" role="tabpanel" aria-labelledby="groups-tab">
    <div class="section-header">
        <h2>My Groups</h2>
        <button class="btn-create" type="button">+ Create Group</button>
    </div>

    <div class="list-row" data-group-type="travel">
        <div class="group-icon group-icon-travel">
            <svg class="icon-text" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2"/>
                <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
        </div>
        <div class="row-info">
            <p class="row-title">Weekend Trip</p>
            <p class="row-meta">5 members</p>
        </div>
        <div class="row-balance is-positive">
            <p class="amount">€120.50</p>
            <p class="balance-note">you are owed</p>
        </div>
        <svg class="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <div class="list-row" data-group-type="home">
        <div class="group-icon group-icon-home">
            <svg class="icon-text" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <div class="row-info">
            <p class="row-title">Flatmates</p>
            <p class="row-meta">3 members</p>
        </div>
        <div class="row-balance is-negative">
            <p class="amount">-€45.20</p>
            <p class="balance-note">you owe</p>
        </div>
        <svg class="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <div class="list-row last" data-group-type="celebration">
        <div class="group-icon group-icon-celebration">
            <svg class="icon-text" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        </div>
        <div class="row-info">
            <p class="row-title">Birthday Party</p>
            <p class="row-meta">4 members</p>
        </div>
        <div class="row-balance is-neutral">
            <p class="amount">€0.00</p>
            <p class="balance-note">settled up</p>
        </div>
        <svg class="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
</section>
