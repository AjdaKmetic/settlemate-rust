<section class="tab-panel" id="groups-panel" role="tabpanel" aria-labelledby="groups-tab"
         data-panel="groups">
    <div class="section-header">
        <h2>My Groups</h2>
        <button class="btn-create" type="button"
                hx-get="/groups/new"
                hx-target="#group-form-slot"
                hx-swap="innerHTML">
            + Create Group
        </button>
    </div>

    <div id="group-form-slot">
    </div>

    <div id="groups-list">
        {% for group in groups %}
            {% include "group_item.html" %}
        {% endfor %}
    </div>

    {% if groups.is_empty() %}
    <div class="empty-state" id="groups-empty-state">
        <p class="secondary-text">No groups created yet.</p>
    </div>
    {% endif %}
</section>
