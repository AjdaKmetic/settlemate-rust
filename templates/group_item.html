<div class="list-row"
     hx-get="/groups/{{ group.id }}"
     hx-target="#groups-panel"
     hx-swap="outerHTML">
    <div class="group-icon group-icon-home">
        <svg class="icon-text" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
    </div>
    <div class="row-info">
        <p class="row-title">{{ group.name }}</p>
        <p class="row-meta">0 members</p>
    </div>
    <div class="row-balance is-neutral">
        <p class="amount">€0.00</p>
        <p class="balance-note">settled up</p>
    </div>
    <svg class="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
    </svg>
</div>
