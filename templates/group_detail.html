<section class="tab-panel" id="groups-panel" role="tabpanel" aria-labelledby="groups-tab"
         data-panel="groups">
    <div class="section-header">
        <h2>{{ group.name }}</h2>
        <button class="btn-cancel" type="button"
                hx-get="/tabs/groups"
                hx-target="#tab-shell"
                hx-swap="outerHTML">
            Back
        </button>
    </div>

    <div class="list-row last">
        <div class="group-icon group-icon-home">
            <svg class="icon-text" width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        </div>
        <div class="row-info">
            <p class="row-title">{{ group.name }}</p>
            <p class="row-meta">0 members</p>
        </div>
        <div class="row-balance is-neutral">
            <p class="amount">€0.00</p>
            <p class="balance-note">settled up</p>
        </div>
    </div>
</section>
